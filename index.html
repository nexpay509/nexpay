<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEX PAY - Investment Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #fafa1a; font-family: sans-serif; margin: 0; padding-bottom: 70px; }
        .container { max-width: 900px; margin: 20px auto; padding: 15px; }
        .card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-bottom: 15px; }
        .btn-primary { background-color: #28a745; color: white; font-weight: bold; padding: 10px 20px; border-radius: 8px; text-align: center; display: block; width: 100%; }
    </style>
</head>
<body>

    <div class="container" id="app">
        <h1 class="text-2xl font-bold text-center mb-4">NEX PAY</h1>
        
        <!-- Balance Card -->
        <div class="card text-center">
            <p class="text-gray-600">মোট ব্যালেন্স</p>
            <h2 id="userBalance" class="text-3xl font-bold text-green-600">৳ 1360.00</h2>
            <div class="flex gap-2 mt-4">
                <button onclick="openDepositModal()" class="bg-blue-600 text-white py-2 px-4 rounded w-1/2 font-bold">ডिपোজিট</button>
                <button onclick="openWithdrawModal()" class="bg-red-600 text-white py-2 px-4 rounded w-1/2 font-bold">উইথড্র</button>
            </div>
        </div>

        <!-- VIP Packages -->
        <div class="space-y-4">
            <div class="card flex justify-between items-center">
                <div>
                    <h3 class="font-bold text-lg">VIP 1</h3>
                    <p class="text-sm text-gray-500">দৈনিক আয় ৳ ১০০</p>
                </div>
                <button onclick="buyVip(1, 1000)" class="bg-amber-500 text-white px-4 py-2 rounded font-bold">১,০০০ টাকা এখনই কিনুন</button>
            </div>
            
            <div class="card flex justify-between items-center">
                <div>
                    <h3 class="font-bold text-lg">VIP 2</h3>
                    <p class="text-sm text-gray-500">দৈনিক আয় ৳ ৮৮৮</p>
                </div>
                <button onclick="buyVip(2, 3000)" class="bg-amber-500 text-white px-4 py-2 rounded font-bold">৩,০০০ টাকা এখনই কিনুন</button>
            </div>
        </div>
    </div>

    <!-- Script to handle logic -->
    <script>
        let balance = 1360.00;

        function updateUI() {
            document.getElementById('userBalance').innerText = `৳ ${balance.toFixed(2)}`;
        }

        function buyVip(vipLevel, price) {
            if (balance >= price) {
                balance -= price;
                updateUI();
                alert(`সফলভাবে VIP ${vipLevel} ক্রয় করা হয়েছে!`);
            } else {
                alert('আপনার অ্যাকাউন্টে পর্যাপ্ত ব্যালেন্স নেই!');
            }
        }

        function openDepositModal() {
            alert('ডিপোজিট অপشن খুলছে...');
        }

        function openWithdrawModal() {
            let amount = prompt('উইথড্র করার পরিমাণ লিখুন:');
            if (amount) {
                amount = parseFloat(amount);
                if (amount > 0 && amount <= balance) {
                    balance -= amount;
                    updateUI();
                    alert('উইথড্র সফল হয়েছে!');
                } else {
                    alert('পর্যাপ্ত ব্যালেন্স নেই বা ভুল পরিমাণ দিয়েছেন।');
                }
            }
        }
    </script>
</body>
</html>
